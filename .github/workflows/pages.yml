name: Build LaTeX Book

on:
  push:
    branches: [dev, main]
    paths-ignore:
      - 'site/**'
      - '.github/workflows/site.yml'
  pull_request:
    branches: [dev, main]
    paths-ignore:
      - 'site/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PDF
    runs-on: ubuntu-latest
    timeout-minutes: 15

    concurrency:
      group: latex-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compile LaTeX book
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4
        with:
          root_file: main.tex
          latexmk_use_xelatex: true
          texlive_version: 2026

      - name: Upload PDF for review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: the-very-soil-${{ github.sha }}
          path: build/main.pdf
          if-no-files-found: error
          retention-days: 14

      - name: Upload LaTeX log on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: latex-log-${{ github.sha }}
          path: build/main.log
          if-no-files-found: ignore
          retention-days: 7
