name: Build and Deploy LaTeX Book

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PDF
    runs-on: ubuntu-latest
    timeout-minutes: 15

    concurrency:
      group: latex-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compile LaTeX book
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4
        with:
          root_file: main.tex
          latexmk_use_xelatex: true
          texlive_version: 2026

      - name: Verify PDF and cross-references
        shell: bash
        run: |
          test -s main.pdf

          if grep -En \
            'LaTeX Warning: (There were undefined references|Citation .* undefined|Reference .* undefined)' \
            main.log; then
            echo '::error::The PDF contains unresolved references or citations.'
            exit 1
          fi

      - name: Upload PDF for review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: the-very-soil-${{ github.sha }}
          path: main.pdf
          if-no-files-found: error
          retention-days: 14

      - name: Upload LaTeX log on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: latex-log-${{ github.sha }}
          path: main.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare GitHub Pages site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          mkdir -p public
          cp site/index.html public/index.html
          cp main.pdf public/book.pdf

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: public

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    concurrency:
      group: github-pages
      cancel-in-progress: false

    permissions:
      actions: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
